[project]
name = "toni-healthmap"
version = "0.1.0"
description = "Extracción de datos personales de salud y entrenamiento (Strava + Garmin Personal API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "duckdb>=1.1",
    "click>=8.1",
    "fitparse>=1.2",
]

[project.scripts]
healthmap = "healthmap.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthmap"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
